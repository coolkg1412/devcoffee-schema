[project]
name = "devcoffee-integration-event"
version = "1.3.1"
description = "DevCoffee events data"
authors = [{ name = "Hieu Nguyen", email = "hieu.nguyen@devcoffee.tech" }]
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }

dependencies = ["pydantic>=2.12.5"]


[build-system]
requires = ["uv_build>=0.11.19,<0.12"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.uv.build-backend]
# Import package is `tech.devcoffee.integration.events`, not the project name.
module-name = "tech"
module-root = "src"
